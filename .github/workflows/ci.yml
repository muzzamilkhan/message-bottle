name: CI

# Mirrors the pre-commit hook (.githooks/pre-commit). The hook is opt-in per
# clone and skippable with --no-verify, so this is what actually keeps main
# green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 24: the test suite relies on Node's native TypeScript
          # stripping, so an older LTS would fail to run the .ts test files.
          node-version: '24'
          cache: npm

      # `npm ci` runs the postinstall hook (prisma generate), which only reads
      # prisma/schema.prisma and needs no database connection.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run typecheck
